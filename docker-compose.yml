version: '3.8'
services:
  api:
    build: ./backend/api
    ports:
      - '5000:5000'
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      - redis
      - db

  worker:
    build: ./backend/worker
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  uploads:
  pgdata:
